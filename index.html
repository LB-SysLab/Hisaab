<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hisaab</title>
<meta name="description" content="Hisaab: a simple digital khata for your shop. Track who owes what and send WhatsApp reminders in one tap.">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#12355B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand" id="brand-home">
        <div class="mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 3v18M12 8h4M12 12h4M12 16h3"/></svg></div>
        <div class="brand-text"><b data-t="app">Hisaab</b><span id="shop-name"></span></div>
      </div>
      <button type="button" class="icon-btn" id="back-btn" hidden>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        <span class="sr" data-t="back" hidden>Back</span>
      </button>
      <div class="bar-right">
        <div class="langs" role="group" aria-label="Language">
          <button type="button" id="lang-en" data-lang="en" lang="en">EN</button>
          <button type="button" id="lang-hi" data-lang="hi" lang="hi">हिं</button>
          <button type="button" id="lang-te" data-lang="te" lang="te">తె</button>
        </div>
        <button type="button" class="icon-btn" id="settings-btn" aria-label="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </div>

    <div id="top-home">
      <div class="total">
        <span class="lbl" data-t="total">Total to collect</span>
        <div class="bignum" id="total-outstanding" aria-live="polite"></div>
        <span class="sub" id="total-sub"></span>
      </div>
    </div>

    <div id="top-cust" hidden>
      <div class="cust-top">
        <div class="nm-row"><div class="nm" id="c-name"></div><button type="button" class="edit-cust" id="edit-cust" data-t="editCust">Edit</button></div>
        <div class="ph" id="c-phone"></div>
      </div>
      <div class="total">
        <span class="lbl" id="c-bal-lbl" data-t="balanceLbl">Balance</span>
        <div class="bignum" id="c-balance"></div>
      </div>
      <div class="cust-actions">
        <button type="button" class="btn on-band" id="add-credit"></button>
        <button type="button" class="btn on-band gold" id="add-payment"></button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- HOME -->
  <section id="view-home">
    <div class="tools">
      <label class="search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" autocomplete="off" aria-label="Search">
      </label>
      <div class="chips" role="group">
        <button type="button" class="chip" id="f-all" data-f="all"></button>
        <button type="button" class="chip" id="f-owe" data-f="owe"></button>
        <button type="button" class="chip" id="f-late" data-f="late"></button>
      </div>
    </div>

    <div class="banner" id="example-banner" hidden>
      <p data-t="exampleBanner"></p>
      <button type="button" class="btn ghost" id="start-fresh" data-t="startFresh"></button>
    </div>
    <div class="banner" id="upi-banner" hidden>
      <p data-t="upiMissing"></p>
      <button type="button" class="btn ghost" id="upi-fix" data-t="settings"></button>
    </div>

    <div class="head"><h2 data-t="customers">Customers</h2><span id="sort-label"></span></div>
    <ul class="list" id="list"></ul>

    <!-- Bottom of the home page: two separate boxes side by side -->
    <div class="pair auto" id="bottom-pair">
      <section class="pair-box" id="sum-box">
        <div class="head"><h2 data-t="sumTitle">Summary</h2></div>
        <div class="panel sum-panel" id="summary">
            <span id="sum-range"></span>
          <div class="chips" role="group" id="sum-periods">
            <button type="button" class="chip" data-days="7" data-t="sumWeek" aria-pressed="true">Week</button>
            <button type="button" class="chip" data-days="14" data-t="sum2Weeks" aria-pressed="false">2 weeks</button>
            <button type="button" class="chip" data-days="30" data-t="sumMonth" aria-pressed="false">Month</button>
          </div>
          <div class="sum-rows">
            <div class="sum-row"><span data-t="sumGot">Money received</span><b class="got" id="sum-got"></b></div>
            <div class="sum-row"><span data-t="sumGave">Credit given</span><b class="gave" id="sum-gave"></b></div>
            <div class="sum-row"><span data-t="sumPending">Still pending (today)</span><b id="sum-pending"></b></div>
          </div>
          <p class="sum-diff" id="sum-diff"></p>
          <p class="hint" data-t="sumNote"></p>
        </div>
      </section>
      <section class="pair-box" id="data-box">
        <div class="head"><h2 data-t="dataTitle">Shop data</h2></div>
        <div class="panel" id="data-panel">
          <label for="import-box"><h3 data-t="importLbl">Load shop data</h3></label>
          <p data-t="importHelp"></p>
          <textarea id="import-box" spellcheck="false" placeholder='{ "customers": [ ... ] }'></textarea>
          <div class="err" id="import-err" hidden></div>
          <div class="btn-row">
            <button type="button" class="btn primary" id="import-go" data-t="importGo">Load data</button>
            <label class="btn ghost" for="import-file"><span data-t="importFile"></span></label>
            <input type="file" id="import-file" accept=".json,application/json" hidden>
          </div>
          <div class="btn-row">
            <button type="button" class="btn ghost" id="export-csv" data-t="exportCsv"></button>
            <button type="button" class="btn ghost" id="install-btn" data-t="install" hidden></button>
          </div>
        </div>
      </section>
    </div>
    <p class="foot" data-t="foot"></p>
  </section>

  <!-- CUSTOMER -->
  <section id="view-cust" hidden>
    <div class="tools">
      <div class="panel" style="flex-direction:row;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 14px">
        <span class="hint" id="c-last"></span>
        <a class="remind" id="c-remind" target="_blank" rel="noopener"></a>
      </div>
    </div>
    <div class="head"><h2 data-t="entries">Entries</h2><span data-t="newestFirst"></span></div>
    <ul class="list" id="entries"></ul>
    <p class="foot"></p>
  </section>
</main>

<button type="button" class="fab" id="add-cust-btn">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  <span data-t="add">Add customer</span>
</button>

<!-- Sheet: add customer -->
<div class="sheet-wrap" id="sheet-cust" hidden>
  <form class="sheet" id="cust-form" novalidate>
    <div class="grab"></div>
    <h2 id="cust-title" data-t="addCustomerTitle">New customer</h2>
    <div class="field">
      <label for="cust-name" data-t="name">Name</label>
      <input id="cust-name" type="text" autocomplete="off" maxlength="60" data-translit autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="cust-phone" data-t="phone">Mobile number</label>
      <input id="cust-phone" type="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
      <span class="hint" data-t="phoneHint"></span>
    </div>
    <div class="err" id="cust-err" role="alert" hidden></div>
    <div class="btn-row">
      <button type="button" class="btn ghost" data-close data-t="cancel">Cancel</button>
      <button type="submit" class="btn primary" id="cust-save" data-t="save">Save</button>
    </div>
    <div class="del-cust" id="del-cust-wrap" hidden>
      <button type="button" class="btn del-btn" id="del-cust" data-t="delCust">Delete customer</button>
      <span class="hint" id="del-cust-hint"></span>
      <div class="err" id="del-cust-msg" role="alert" hidden></div>
    </div>
  </form>
</div>

<!-- Sheet: entry (credit / payment) -->
<div class="sheet-wrap" id="sheet-entry" hidden>
  <form class="sheet" id="entry-form" novalidate>
    <div class="grab"></div>
    <h2 id="entry-title"></h2>
    <div class="field">
      <span class="lab" data-t="type">Type</span>
      <div class="seg">
        <label id="lab-credit"><input type="radio" name="etype" id="type-credit" value="credit"><span data-t="credit"></span></label>
        <label id="lab-payment"><input type="radio" name="etype" id="type-payment" value="payment"><span data-t="payment"></span></label>
      </div>
    </div>
    <div class="field">
      <label for="entry-amount" data-t="amount">Amount</label>
      <input id="entry-amount" type="number" inputmode="decimal" min="1" step="any">
    </div>
    <div class="field">
      <label for="entry-date" data-t="date">Date</label>
      <input id="entry-date" type="date">
    </div>
    <div class="field">
      <label for="entry-note" data-t="note">Note</label>
      <input id="entry-note" type="text" maxlength="80" autocomplete="off" data-translit autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="field" id="shot-field">
      <label for="shot-input" data-t="shot">Payment screenshot</label>
      <div class="file-pick">
        <input type="file" id="shot-input" accept="image/*">
        <img id="shot-prev" class="shot-prev" alt="" hidden>
        <button type="button" class="mini danger" id="shot-remove" data-t="removePic" hidden></button>
      </div>
      <span class="hint" data-t="shotHint"></span>
      <div class="ocr" id="ocr" hidden></div>
    </div>
    <div class="err" id="entry-err" role="alert" hidden></div>
    <div class="btn-row">
      <button type="button" class="btn ghost" data-close data-t="cancel">Cancel</button>
      <button type="submit" class="btn primary" id="entry-save" data-t="save">Save</button>
    </div>
  </form>
</div>

<!-- Sheet: settings -->
<div class="sheet-wrap" id="sheet-settings" hidden>
  <form class="sheet" id="settings-form" novalidate>
    <div class="grab"></div>
    <h2 data-t="settings">Settings</h2>
    <div class="field">
      <label for="set-shop" data-t="shopName">Shop name</label>
      <input id="set-shop" type="text" maxlength="60" autocomplete="off" data-translit autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="set-upi" data-t="upi">UPI ID</label>
      <input id="set-upi" type="text" maxlength="80" autocomplete="off" autocapitalize="off" spellcheck="false">
      <span class="hint" data-t="upiHint"></span>
    </div>
    <div class="err" id="set-err" role="alert" hidden></div>
    <div class="btn-row">
      <button type="button" class="btn ghost" data-close data-t="cancel">Cancel</button>
      <button type="submit" class="btn primary" data-t="saveSettings">Save</button>
    </div>
    <div class="btn-row" style="margin-top:18px">
      <button type="button" class="btn danger" id="clear-all" data-t="clearAll"></button>
    </div>
  </form>
</div>

<div class="viewer" id="viewer" hidden><img id="viewer-img" alt=""></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="js/i18n.js"></script>
<script src="js/sample-data.js"></script>
<script src="js/core.js"></script>
<script src="js/app.js"></script>
</body>
</html>
